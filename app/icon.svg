<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Dark Forest Squircle Base with Subtle Border -->
  <rect
    width="100"
    height="100"
    rx="24"
    fill="#1A3828"
    stroke="rgba(245, 241, 230, 0.35)"
    stroke-width="3"
  />
  
  <!-- Terracotta Sun / Dot -->
  <circle cx="58" cy="40" r="7.5" fill="#CB8869" />
  
  <!-- Brush Stroke Arc / Enso Curve -->
  <path
    d="M 28 65 C 18 45, 32 20, 54 20 C 72 20, 82 36, 80 54"
    stroke="#FAF8F2"
    stroke-width="5"
    stroke-linecap="round"
  />
  
  <!-- Birds in Flight -->
  <path
    d="M 28 26 Q 32 21 36 25 Q 40 21 44 25"
    stroke="#FAF8F2"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M 20 34 Q 23 30 26 33 Q 29 30 32 33"
    stroke="#C1CBAE"
    stroke-width="2"
    stroke-linecap="round"
  />
  
  <!-- Winding Path Towards Horizon -->
  <path
    d="M 16 80 Q 42 74 58 54 L 84 54"
    stroke="#FAF8F2"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  
  <!-- Traveler Silhouette -->
  <circle cx="58" cy="47" r="2.2" fill="#FAF8F2" />
  <line
    x1="58"
    y1="49.5"
    x2="58"
    y2="54"
    stroke="#FAF8F2"
    stroke-width="2.2"
    stroke-linecap="round"
  />
</svg>
